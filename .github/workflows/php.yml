name: PHP checks

on:
  push:
    branches: ["main", "repair/**"]
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and required extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -m | grep -E 'PDO|pdo_sqlite|sqlite3|mbstring'
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
